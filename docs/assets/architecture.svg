<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="arcT arcD" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <title id="arcT">Daily Digital Twin — architecture</title>
  <desc id="arcD">Entry points feed a local control plane, which dispatches executors; guards on the right enforce evidence, telemetry, permissions, and privacy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1219"/>
      <stop offset="0.55" stop-color="#0e1622"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7db4f0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7db4f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151f2c"/>
      <stop offset="1" stop-color="#111925"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2635"/>
      <stop offset="1" stop-color="#161f2b"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5e6b7e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#e8c57a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ahDashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4d9d8d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="20" fill="url(#bg)"/>
  <ellipse cx="600" cy="70" rx="460" ry="180" fill="url(#glowTop)"/>
  <ellipse cx="460" cy="430" rx="380" ry="150" fill="url(#glowBlue)"/>

  <g stroke="#e8c57a" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <path d="M36 60V36h24"/>
    <path d="M1140 36h24v24"/>
    <path d="M36 700v24h24"/>
    <path d="M1140 724h24v-24"/>
  </g>

  <text x="600" y="58" text-anchor="middle" font-size="12" fill="#5eead4" fill-opacity="0.85" letter-spacing="6">DAILY DIGITAL TWIN</text>
  <text x="600" y="100" text-anchor="middle" font-size="29" font-weight="600" fill="#e8edf4">How a task flows</text>
  <line x1="430" y1="124" x2="770" y2="124" stroke="url(#hairline)" stroke-width="1"/>

  <line x1="64" y1="230" x2="64" y2="640" stroke="#232e3c" stroke-width="1"/>
  <circle cx="64" cy="230" r="11" fill="#1a2330" stroke="#8d96a6" stroke-opacity="0.7"/>
  <text x="64" y="234" text-anchor="middle" font-size="11" fill="#b9c2cf">1</text>
  <circle cx="64" cy="422" r="11" fill="#1a2330" stroke="#7db4f0" stroke-opacity="0.8"/>
  <text x="64" y="426" text-anchor="middle" font-size="11" fill="#b9c2cf">2</text>
  <circle cx="64" cy="634" r="11" fill="#1a2330" stroke="#5eead4" stroke-opacity="0.8"/>
  <text x="64" y="638" text-anchor="middle" font-size="11" fill="#b9c2cf">3</text>

  <g>
    <rect x="100" y="180" width="720" height="104" rx="16" fill="url(#band)" stroke="#263344"/>
    <text x="124" y="206" font-size="12" fill="#8d96a6">interface — everything a human touches</text>
    <g>
      <rect x="120" y="222" width="158" height="44" rx="10" fill="url(#card)" stroke="#303d4e"/>
      <rect x="120" y="222" width="3" height="44" rx="1.5" fill="#8d96a6"/>
      <text x="199" y="248" text-anchor="middle" font-size="14" fill="#e8edf4">CLI</text>
      <rect x="294" y="222" width="158" height="44" rx="10" fill="url(#card)" stroke="#303d4e"/>
      <rect x="294" y="222" width="3" height="44" rx="1.5" fill="#8d96a6"/>
      <text x="373" y="248" text-anchor="middle" font-size="14" fill="#e8edf4">Feishu gateway</text>
      <rect x="468" y="222" width="158" height="44" rx="10" fill="url(#card)" stroke="#303d4e"/>
      <rect x="468" y="222" width="3" height="44" rx="1.5" fill="#8d96a6"/>
      <text x="547" y="248" text-anchor="middle" font-size="14" fill="#e8edf4">MCP stdio</text>
      <rect x="642" y="222" width="158" height="44" rx="10" fill="url(#card)" stroke="#303d4e"/>
      <rect x="642" y="222" width="3" height="44" rx="1.5" fill="#8d96a6"/>
      <text x="721" y="248" text-anchor="middle" font-size="14" fill="#e8edf4">Config web UI</text>
    </g>
  </g>

  <path d="M460 288 C 460 304, 460 314, 460 326" fill="none" stroke="#5e6b7e" stroke-width="1.5" marker-end="url(#ah)"/>

  <g>
    <rect x="100" y="330" width="720" height="176" rx="16" fill="url(#band)" stroke="#2b3a52"/>
    <text x="124" y="356" font-size="12" fill="#7db4f0">control plane — src/core</text>
    <g>
      <rect x="120" y="376" width="158" height="72" rx="10" fill="url(#card)" stroke="#303d4e"/>
      <rect x="120" y="376" width="3" height="72" rx="1.5" fill="#7db4f0"/>
      <text x="199" y="404" text-anchor="middle" font-size="14" fill="#e8edf4">Scheduler loop</text>
      <text x="199" y="424" text-anchor="middle" font-size="11.5" fill="#8d96a6">slots · backoff · mutex</text>
      <rect x="294" y="376" width="158" height="72" rx="10" fill="url(#card)" stroke="#303d4e"/>
      <rect x="294" y="376" width="3" height="72" rx="1.5" fill="#7db4f0"/>
      <text x="373" y="404" text-anchor="middle" font-size="14" fill="#e8edf4">Task store</text>
      <text x="373" y="424" text-anchor="middle" font-size="11.5" fill="#8d96a6">SQLite · WAL</text>
      <rect x="468" y="376" width="158" height="72" rx="10" fill="url(#card)" stroke="#303d4e"/>
      <rect x="468" y="376" width="3" height="72" rx="1.5" fill="#7db4f0"/>
      <text x="547" y="404" text-anchor="middle" font-size="14" fill="#e8edf4">Token ledger</text>
      <text x="547" y="424" text-anchor="middle" font-size="11.5" fill="#8d96a6">per-task cost</text>
      <rect x="642" y="376" width="158" height="72" rx="10" fill="url(#card)" stroke="#303d4e"/>
      <rect x="642" y="376" width="3" height="72" rx="1.5" fill="#7db4f0"/>
      <text x="721" y="404" text-anchor="middle" font-size="14" fill="#e8edf4">Redaction</text>
      <text x="721" y="424" text-anchor="middle" font-size="11.5" fill="#8d96a6">receipts sanitized</text>
    </g>
    <text x="460" y="486" text-anchor="middle" font-size="11" fill="#66738a">one SQLite database · one owner · private state never leaves DAILY_TWIN_HOME</text>
  </g>

  <path d="M460 510 C 460 526, 460 538, 460 554" fill="none" stroke="#5e6b7e" stroke-width="1.5" marker-end="url(#ah)"/>

  <g>
    <rect x="100" y="560" width="720" height="146" rx="16" fill="url(#band)" stroke="#274444"/>
    <text x="124" y="586" font-size="12" fill="#5eead4">executors — the only code that acts on the machine</text>
    <g>
      <rect x="111" y="606" width="222" height="68" rx="10" fill="url(#card)" stroke="#303d4e"/>
      <rect x="111" y="606" width="3" height="68" rx="1.5" fill="#5eead4"/>
      <text x="222" y="634" text-anchor="middle" font-size="14" fill="#e8edf4">AI executor</text>
      <text x="222" y="654" text-anchor="middle" font-size="11.5" fill="#8d96a6">ai_call tasks · vision routing</text>
      <rect x="349" y="606" width="222" height="68" rx="10" fill="url(#card)" stroke="#303d4e"/>
      <rect x="349" y="606" width="3" height="68" rx="1.5" fill="#5eead4"/>
      <text x="460" y="634" text-anchor="middle" font-size="14" fill="#e8edf4">Private executor</text>
      <text x="460" y="654" text-anchor="middle" font-size="11.5" fill="#8d96a6">desktop · browser</text>
      <rect x="587" y="606" width="222" height="68" rx="10" fill="url(#card)" stroke="#303d4e"/>
      <rect x="587" y="606" width="3" height="68" rx="1.5" fill="#5eead4"/>
      <text x="698" y="634" text-anchor="middle" font-size="14" fill="#e8edf4">Placeholder</text>
      <text x="698" y="654" text-anchor="middle" font-size="11.5" fill="#8d96a6">unknown → partial</text>
    </g>
  </g>

  <g>
    <rect x="880" y="176" width="280" height="64" rx="12" fill="url(#card)" stroke="#3e7a6d" stroke-dasharray="5 4"/>
    <text x="1020" y="202" text-anchor="middle" font-size="14" fill="#a7e6d9">Remote model</text>
    <text x="1020" y="222" text-anchor="middle" font-size="11.5" fill="#6f95a3">planning only — untrusted</text>
  </g>
  <path d="M880 212 C 822 220, 800 290, 818 348" fill="none" stroke="#4d9d8d" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ahDashed)"/>

  <text x="880" y="278" font-size="12" fill="#e8c57a">guards — fail closed</text>
  <g>
    <rect x="880" y="292" width="280" height="76" rx="12" fill="url(#card)" stroke="#303d4e"/>
    <rect x="880" y="292" width="3" height="76" rx="1.5" fill="#e8c57a"/>
    <text x="904" y="322" font-size="14" fill="#e8edf4">Evidence verifier</text>
    <text x="904" y="344" font-size="11.5" fill="#8d96a6">no evidence → partial, never completed</text>
    <rect x="880" y="388" width="280" height="76" rx="12" fill="url(#card)" stroke="#303d4e"/>
    <rect x="880" y="388" width="3" height="76" rx="1.5" fill="#e8c57a"/>
    <text x="904" y="418" font-size="14" fill="#e8edf4">Resource policy</text>
    <text x="904" y="440" font-size="11.5" fill="#8d96a6">stale telemetry → 0 slots</text>
    <rect x="880" y="484" width="280" height="76" rx="12" fill="url(#card)" stroke="#303d4e"/>
    <rect x="880" y="484" width="3" height="76" rx="1.5" fill="#e8c57a"/>
    <text x="904" y="514" font-size="14" fill="#e8edf4">Capability tickets</text>
    <text x="904" y="536" font-size="11.5" fill="#8d96a6">HMAC · one-shot nonce · allow-list</text>
    <rect x="880" y="580" width="280" height="76" rx="12" fill="url(#card)" stroke="#303d4e"/>
    <rect x="880" y="580" width="3" height="76" rx="1.5" fill="#e8c57a"/>
    <text x="904" y="610" font-size="14" fill="#e8edf4">Privacy audit</text>
    <text x="904" y="632" font-size="11.5" fill="#8d96a6">enforced locally and in CI</text>
  </g>

  <path d="M820 420 L874 422" fill="none" stroke="#e8c57a" stroke-opacity="0.65" stroke-width="1.3" marker-end="url(#ahAmber)"/>
  <path d="M820 630 C 852 630, 868 520, 876 376" fill="none" stroke="#e8c57a" stroke-opacity="0.65" stroke-width="1.3" marker-end="url(#ahAmber)"/>
  <text x="856" y="497" text-anchor="middle" font-size="10.5" fill="#c8a95e">proof</text>

  <text x="600" y="744" text-anchor="middle" font-size="11.5" fill="#5a6478">honest status · fail closed · private by default — checked locally, never trusted to the cloud</text>
</svg>
