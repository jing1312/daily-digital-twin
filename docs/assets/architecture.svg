<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" role="img">
  <title>Daily Digital Twin architecture</title>
  <desc>Entry points feed a local control plane, which dispatches executors on the same machine; safety guards verify evidence, resources, and permissions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowamber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="620" rx="16" fill="#ffffff"/>
  <style>
    .t { font: 400 13px system-ui, 'Segoe UI', sans-serif; }
    .ts { font: 400 11px system-ui, 'Segoe UI', sans-serif; }
    .th { font: 500 13px system-ui, 'Segoe UI', sans-serif; }
    .cap { font: 400 11px system-ui, 'Segoe UI', sans-serif; fill: #888780; }
  </style>

  <text class="cap" x="55" y="28" fill="#888780">entry points</text>
  <g>
    <rect x="55" y="40" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="th" x="145" y="58" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">CLI</text>
    <text class="ts" x="145" y="74" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">runtime.mjs</text>
    <rect x="265" y="40" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="th" x="355" y="58" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Feishu gateway</text>
    <text class="ts" x="355" y="74" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">serve · receipts</text>
    <rect x="475" y="40" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="th" x="565" y="58" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">MCP</text>
    <text class="ts" x="565" y="74" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">stdio · local tools</text>
    <rect x="685" y="40" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="th" x="775" y="58" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Config web UI</text>
    <text class="ts" x="775" y="74" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">127.0.0.1:18791</text>
  </g>

  <path d="M145 88 L145 148" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M355 88 L355 148" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M565 88 L565 148" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M775 88 L775 122 L649 122" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3"/>

  <text class="cap" x="55" y="144" fill="#5F5E5A">control plane — src/core, one SQLite database, one owner</text>
  <g>
    <rect x="55" y="150" width="590" height="140" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="75" y="205" width="127" height="56" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="138" y="225" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Scheduler loop</text>
    <text class="ts" x="138" y="243" text-anchor="middle" dominant-baseline="central" fill="#378ADD">slots · backoff</text>
    <rect x="216" y="205" width="127" height="56" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="279" y="225" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Task store</text>
    <text class="ts" x="279" y="243" text-anchor="middle" dominant-baseline="central" fill="#378ADD">SQLite · WAL</text>
    <rect x="357" y="205" width="127" height="56" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="420" y="225" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Token ledger</text>
    <text class="ts" x="420" y="243" text-anchor="middle" dominant-baseline="central" fill="#378ADD">per-task cost</text>
    <rect x="498" y="205" width="127" height="56" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="561" y="225" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Redaction</text>
    <text class="ts" x="561" y="243" text-anchor="middle" dominant-baseline="central" fill="#378ADD">receipts</text>
  </g>

  <g>
    <rect x="685" y="165" width="180" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="4 3"/>
    <text class="th" x="775" y="189" text-anchor="middle" dominant-baseline="central" fill="#04342C">Remote model</text>
    <text class="ts" x="775" y="207" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">OpenAI-compatible API</text>
  </g>
  <path d="M685 197 L651 197" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="668" y="184" text-anchor="middle" fill="#0F6E56">plan only</text>

  <text class="cap" x="55" y="384" fill="#0F6E56">executors — the only code that acts on the machine</text>
  <g>
    <rect x="55" y="390" width="590" height="150" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="75" y="445" width="170" height="56" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="160" y="465" text-anchor="middle" dominant-baseline="central" fill="#04342C">AI executor</text>
    <text class="ts" x="160" y="483" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">ai_call tasks</text>
    <rect x="265" y="445" width="170" height="56" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="350" y="465" text-anchor="middle" dominant-baseline="central" fill="#04342C">Private executor</text>
    <text class="ts" x="350" y="483" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">desktop · browser</text>
    <rect x="455" y="445" width="170" height="56" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="540" y="465" text-anchor="middle" dominant-baseline="central" fill="#04342C">Placeholder</text>
    <text class="ts" x="540" y="483" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">unknown → partial</text>
  </g>

  <path d="M160 290 L160 388" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowblue)"/>
  <path d="M350 290 L350 388" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowblue)"/>
  <path d="M540 290 L540 388" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowblue)"/>

  <text class="cap" x="685" y="288" fill="#854F0B">guards — fail closed</text>
  <g>
    <rect x="685" y="300" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="775" y="320" text-anchor="middle" dominant-baseline="central" fill="#633806">Evidence verifier</text>
    <text class="ts" x="775" y="338" text-anchor="middle" dominant-baseline="central" fill="#BA7517">no evidence → partial</text>
    <rect x="685" y="372" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="775" y="392" text-anchor="middle" dominant-baseline="central" fill="#633806">Resource policy</text>
    <text class="ts" x="775" y="410" text-anchor="middle" dominant-baseline="central" fill="#BA7517">stale telemetry → 0 slots</text>
    <rect x="685" y="444" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="775" y="464" text-anchor="middle" dominant-baseline="central" fill="#633806">Capability tickets</text>
    <text class="ts" x="775" y="482" text-anchor="middle" dominant-baseline="central" fill="#BA7517">HMAC · one-shot nonce</text>
    <rect x="685" y="516" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="775" y="536" text-anchor="middle" dominant-baseline="central" fill="#633806">Privacy audit</text>
    <text class="ts" x="775" y="554" text-anchor="middle" dominant-baseline="central" fill="#BA7517">CI enforced</text>
  </g>

  <path d="M645 465 L663 465 L663 328 L683 328" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrowamber)"/>
</svg>
