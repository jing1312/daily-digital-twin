<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" role="img">
  <title>Evidence-gated task lifecycle</title>
  <desc>A task runs, then must present process, window, page, or file evidence; verified evidence completes it, missing evidence leaves it partial, and exhausted retries fail it.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="280" rx="16" fill="#ffffff"/>
  <style>
    .t { font: 400 13px system-ui, 'Segoe UI', sans-serif; }
    .ts { font: 400 11px system-ui, 'Segoe UI', sans-serif; }
    .th { font: 500 13px system-ui, 'Segoe UI', sans-serif; }
  </style>

  <g>
    <rect x="40" y="100" width="110" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="th" x="95" y="124" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">queued</text>
    <rect x="210" y="100" width="110" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="265" y="124" text-anchor="middle" dominant-baseline="central" fill="#0C447C">running</text>
  </g>
  <path d="M150 124 L208 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M320 124 L428 124" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <polygon points="530,68 624,124 530,180 436,124" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="530" y="118" text-anchor="middle" dominant-baseline="central" fill="#633806">any evidence?</text>
  <text class="ts" x="530" y="136" text-anchor="middle" dominant-baseline="central" fill="#BA7517">process · window</text>
  <text class="ts" x="530" y="152" text-anchor="middle" dominant-baseline="central" fill="#BA7517">page · file</text>

  <g>
    <rect x="700" y="56" width="180" height="48" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text class="th" x="790" y="80" text-anchor="middle" dominant-baseline="central" fill="#173404">completed</text>
    <rect x="700" y="124" width="180" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="790" y="148" text-anchor="middle" dominant-baseline="central" fill="#633806">partial</text>
    <rect x="700" y="192" width="180" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text class="th" x="790" y="216" text-anchor="middle" dominant-baseline="central" fill="#501313">failed</text>
  </g>

  <path d="M624 124 L660 124 L660 80 L698 80" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text class="ts" x="662" y="60" text-anchor="middle" fill="#3B6D11">verified</text>
  <path d="M624 124 L698 148" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text class="ts" x="660" y="118" text-anchor="middle" fill="#854F0B">none</text>
  <path d="M265 148 L265 252 L790 252 L790 242" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text class="ts" x="500" y="246" text-anchor="middle" fill="#A32D2D">retries exhausted</text>
</svg>
