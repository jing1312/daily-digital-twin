<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="egT egD" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <title id="egT">Daily Digital Twin — evidence gate</title>
  <desc id="egD">A task must present process, window, page, or file evidence; verified evidence completes it, missing evidence leaves it partial, exhausted retries fail it. Shown as an evidence checklist card for one real task.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12294f"/>
      <stop offset="55%" stop-color="#1e4277"/>
      <stop offset="100%" stop-color="#2f5fb8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fb9ff"/>
      <stop offset="100%" stop-color="#c9e2ff"/>
    </linearGradient>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0a1830" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1050" cy="50" r="190" fill="#38bdf8" opacity="0.07"/>
  <circle cx="1130" cy="290" r="160" fill="#a78bfa" opacity="0.06"/>
  <circle cx="60" cy="300" r="140" fill="#38bdf8" opacity="0.05"/>

  <!-- 左侧文案 -->
  <rect x="80" y="46" width="196" height="34" rx="17" fill="none" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text x="178" y="69" font-size="14" font-weight="600" fill="#7fb9ff" text-anchor="middle" letter-spacing="2">EVIDENCE GATE</text>
  <text x="80" y="136" font-size="54" font-weight="700" fill="#ffffff">先拿证据</text>
  <text x="80" y="204" font-size="54" font-weight="700" fill="url(#headline)">再谈完成</text>
  <text x="82" y="246" font-size="18" fill="#cfe0ff">进程 · 窗口 · 页面 · 文件，四类实证缺一不可 —— 缺了就如实 partial</text>

  <!-- 底部小流程带 -->
  <g font-size="12.5" fill="#dbe8ff">
    <circle cx="84" cy="278" r="4" fill="#9db8e0"/>
    <text x="94" y="282">queued</text>
    <text x="152" y="282" fill="#8aa6d4">→</text>
    <circle cx="184" cy="278" r="4" fill="#38bdf8"/>
    <text x="194" y="282">running</text>
    <text x="256" y="282" fill="#8aa6d4">→</text>
    <polygon points="288,272 296,278 288,284 280,278" fill="url(#accent)"/>
    <text x="304" y="282">证据核验</text>
    <text x="362" y="282" fill="#8aa6d4">→</text>
    <circle cx="394" cy="278" r="4" fill="#22c55e"/>
    <text x="404" y="282">completed</text>
    <circle cx="492" cy="278" r="4" fill="#fbbf24"/>
    <text x="502" y="282">partial</text>
    <circle cx="556" cy="278" r="4" fill="#f87171"/>
    <text x="566" y="282">failed</text>
  </g>

  <!-- 右侧证据核验单卡片 -->
  <g transform="rotate(-4 940 150)" filter="url(#card-shadow)">
    <rect x="760" y="42" width="360" height="216" rx="18" fill="#ffffff"/>
    <rect x="760" y="42" width="360" height="48" rx="18" fill="#f4f7fc"/>
    <rect x="760" y="66" width="360" height="24" fill="#f4f7fc"/>
    <circle cx="786" cy="66" r="6" fill="#ff5f57"/>
    <circle cx="808" cy="66" r="6" fill="#febc2e"/>
    <circle cx="830" cy="66" r="6" fill="#28c840"/>
    <text x="940" y="72" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">任务 #47 · 早报收集</text>
    <g font-size="13" fill="#333b4d">
      <circle cx="800" cy="112" r="10" fill="#16a34a"/>
      <path d="M 795 112 L 799 116 L 805 108" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="820" y="116">进程证据　edge.exe · pid 85656</text>
      <circle cx="800" cy="148" r="10" fill="#16a34a"/>
      <path d="M 795 148 L 799 152 L 805 144" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="820" y="152">文件证据　outputs/morning.md · 2.3 KB</text>
      <circle cx="800" cy="184" r="10" fill="#16a34a"/>
      <path d="M 795 184 L 799 188 L 805 180" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="820" y="188">页面证据　bing.com · 标题核验通过</text>
    </g>
    <rect x="780" y="206" width="320" height="34" rx="9" fill="#e7f9f0"/>
    <circle cx="800" cy="223" r="9" fill="#16a34a"/>
    <path d="M 795.5 223 L 799 226.5 L 805 219.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="816" y="228" font-size="13.5" font-weight="600" fill="#0f7a43">判定 completed —— 证据齐全，如实闭环</text>
  </g>
</svg>
