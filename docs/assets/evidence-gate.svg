<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="egT egD" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <title id="egT">Daily Digital Twin — evidence gate</title>
  <desc id="egD">A running task must present process, window, page, or file evidence; verified evidence completes it, missing evidence leaves it partial, exhausted retries fail it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12294f"/>
      <stop offset="55%" stop-color="#1e4277"/>
      <stop offset="100%" stop-color="#2f5fb8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gateEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a1830" flood-opacity="0.3"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9db8e0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="1100" cy="40" r="180" fill="#38bdf8" opacity="0.07"/>
  <circle cx="1150" cy="350" r="150" fill="#a78bfa" opacity="0.06"/>
  <circle cx="50" cy="360" r="130" fill="#38bdf8" opacity="0.05"/>

  <g stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <path d="M36 60V36h24"/>
    <path d="M1140 36h24v24"/>
    <path d="M36 300v24h24"/>
    <path d="M1140 324h24v-24"/>
  </g>

  <!-- 标题区 -->
  <rect x="80" y="42" width="196" height="32" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text x="178" y="63" font-size="13.5" font-weight="600" fill="#7fb9ff" text-anchor="middle" letter-spacing="2">EVIDENCE GATE</text>
  <text x="80" y="114" font-size="30" font-weight="700" fill="#ffffff">没有证据，不说完成</text>

  <!-- 主流程 -->
  <g filter="url(#card-shadow)">
    <rect x="80" y="195" width="132" height="60" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#7fb9ff" stroke-opacity="0.28"/>
    <rect x="250" y="195" width="132" height="60" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#7fb9ff" stroke-opacity="0.28"/>
  </g>
  <rect x="80" y="195" width="3" height="60" rx="1.5" fill="#9db8e0"/>
  <rect x="250" y="195" width="3" height="60" rx="1.5" fill="#38bdf8"/>
  <text x="146" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">queued</text>
  <text x="146" y="241" text-anchor="middle" font-size="11" fill="#9db8e0">等待调度</text>
  <text x="316" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">running</text>
  <text x="316" y="241" text-anchor="middle" font-size="11" fill="#9db8e0">执行器干活</text>

  <path d="M212 225 L244 225" fill="none" stroke="#9db8e0" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M386 225 L446 225" fill="none" stroke="#9db8e0" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 证据门控（菱形闸门） -->
  <polygon points="560,161 670,225 560,289 450,225" fill="#ffffff" fill-opacity="0.08" stroke="url(#gateEdge)" stroke-width="1.6" filter="url(#card-shadow)"/>
  <text x="560" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">any evidence?</text>
  <text x="560" y="236" text-anchor="middle" font-size="10.5" fill="#cfe0ff">process · window</text>
  <text x="560" y="252" text-anchor="middle" font-size="10.5" fill="#cfe0ff">page · file</text>

  <!-- 门控出口连线 -->
  <path d="M670 210 C 706 182, 726 168, 792 164" fill="none" stroke="#9db8e0" stroke-opacity="0.8" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="728" y="158" text-anchor="middle" font-size="11" fill="#5eead4">verified</text>
  <path d="M670 225 L792 229" fill="none" stroke="#9db8e0" stroke-opacity="0.8" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="730" y="219" text-anchor="middle" font-size="11" fill="#fbbf24">none</text>
  <path d="M316 255 C 316 322, 560 332, 700 322 C 756 318, 780 306, 794 296" fill="none" stroke="#9db8e0" stroke-opacity="0.8" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="530" y="330" text-anchor="middle" font-size="11" fill="#f87171">retries exhausted</text>

  <!-- 三种结局 -->
  <g filter="url(#card-shadow)">
    <rect x="800" y="137" width="320" height="56" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#7fb9ff" stroke-opacity="0.28"/>
    <rect x="800" y="203" width="320" height="56" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#7fb9ff" stroke-opacity="0.28"/>
    <rect x="800" y="269" width="320" height="56" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#7fb9ff" stroke-opacity="0.28"/>
  </g>
  <rect x="800" y="137" width="3" height="56" rx="1.5" fill="#5eead4"/>
  <circle cx="838" cy="165" r="9" fill="none" stroke="#5eead4" stroke-width="1.4"/>
  <path d="M834.5 165 L837 167.8 L842 162.4" fill="none" stroke="#5eead4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="860" y="161" font-size="15" font-weight="600" fill="#ffffff">completed</text>
  <text x="860" y="180" font-size="11.5" fill="#cfe0ff">证据核验通过，如实闭环</text>

  <rect x="800" y="203" width="3" height="56" rx="1.5" fill="#fbbf24"/>
  <circle cx="838" cy="231" r="9" fill="none" stroke="#fbbf24" stroke-width="1.4"/>
  <path d="M833 231 L843 231" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round"/>
  <text x="860" y="227" font-size="15" font-weight="600" fill="#ffffff">partial</text>
  <text x="860" y="246" font-size="11.5" fill="#cfe0ff">干了活，没证据 —— 诚实上报</text>

  <rect x="800" y="269" width="3" height="56" rx="1.5" fill="#f87171"/>
  <circle cx="838" cy="297" r="9" fill="none" stroke="#f87171" stroke-width="1.4"/>
  <path d="M834.5 293.5 L841.5 300.5 M841.5 293.5 L834.5 300.5" stroke="#f87171" stroke-width="1.4" stroke-linecap="round"/>
  <text x="860" y="293" font-size="15" font-weight="600" fill="#ffffff">failed</text>
  <text x="860" y="312" font-size="11.5" fill="#cfe0ff">重试耗尽，失败关闭，不静默重开</text>

  <!-- 底部结语 -->
  <text x="600" y="346" text-anchor="middle" font-size="12" fill="#b9cce8">partial 是诚实的回答：活干了，证据没到手 —— 没有证据，任务永远不会被叫作 completed</text>
</svg>
