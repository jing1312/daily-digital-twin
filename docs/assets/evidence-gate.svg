<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="egT egD" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <title id="egT">Daily Digital Twin — evidence gate</title>
  <desc id="egD">A running task must present process, window, page, or file evidence; verified evidence completes it, missing evidence leaves it partial, exhausted retries fail it.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1219"/>
      <stop offset="0.55" stop-color="#0e1622"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c57a" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#e8c57a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2635"/>
      <stop offset="1" stop-color="#161f2b"/>
    </linearGradient>
    <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5e6b7e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg2)"/>
  <ellipse cx="620" cy="90" rx="420" ry="130" fill="url(#glow2)"/>

  <g stroke="#e8c57a" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <path d="M36 60V36h24"/>
    <path d="M1140 36h24v24"/>
    <path d="M36 260v24h24"/>
    <path d="M1140 284h24v-24"/>
  </g>

  <g>
    <rect x="70" y="132" width="140" height="56" rx="12" fill="url(#card2)" stroke="#303d4e"/>
    <rect x="70" y="132" width="3" height="56" rx="1.5" fill="#8d96a6"/>
    <text x="140" y="165" text-anchor="middle" font-size="15" fill="#e8edf4">queued</text>

    <rect x="266" y="132" width="140" height="56" rx="12" fill="url(#card2)" stroke="#303d4e"/>
    <rect x="266" y="132" width="3" height="56" rx="1.5" fill="#7db4f0"/>
    <text x="336" y="165" text-anchor="middle" font-size="15" fill="#e8edf4">running</text>
  </g>

  <path d="M210 160 L260 160" fill="none" stroke="#5e6b7e" stroke-width="1.5" marker-end="url(#ah2)"/>
  <path d="M406 160 L512 160" fill="none" stroke="#5e6b7e" stroke-width="1.5" marker-end="url(#ah2)"/>

  <polygon points="620,94 722,160 620,226 518,160" fill="url(#card2)" stroke="#e8c57a" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="620" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#e8edf4">any evidence?</text>
  <text x="620" y="174" text-anchor="middle" font-size="11" fill="#8d96a6">process · window</text>
  <text x="620" y="192" text-anchor="middle" font-size="11" fill="#8d96a6">page · file</text>

  <g>
    <rect x="800" y="72" width="280" height="64" rx="12" fill="url(#card2)" stroke="#303d4e"/>
    <rect x="800" y="72" width="3" height="64" rx="1.5" fill="#5eead4"/>
    <circle cx="838" cy="104" r="9" fill="none" stroke="#5eead4" stroke-width="1.4"/>
    <path d="M834.5 104 L837 106.8 L842 101.4" fill="none" stroke="#5eead4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="862" y="109" font-size="15" fill="#e8edf4">completed</text>

    <rect x="800" y="128" width="280" height="64" rx="12" fill="url(#card2)" stroke="#303d4e"/>
    <rect x="800" y="128" width="3" height="64" rx="1.5" fill="#e8c57a"/>
    <circle cx="838" cy="160" r="9" fill="none" stroke="#e8c57a" stroke-width="1.4"/>
    <path d="M833 160 L843 160" stroke="#e8c57a" stroke-width="1.4" stroke-linecap="round"/>
    <text x="862" y="165" font-size="15" fill="#e8edf4">partial</text>

    <rect x="800" y="184" width="280" height="64" rx="12" fill="url(#card2)" stroke="#303d4e"/>
    <rect x="800" y="184" width="3" height="64" rx="1.5" fill="#f0a8b8"/>
    <circle cx="838" cy="216" r="9" fill="none" stroke="#f0a8b8" stroke-width="1.4"/>
    <path d="M834.5 212.5 L841.5 219.5 M841.5 212.5 L834.5 219.5" stroke="#f0a8b8" stroke-width="1.4" stroke-linecap="round"/>
    <text x="862" y="221" font-size="15" fill="#e8edf4">failed</text>
  </g>

  <path d="M700 128 C 740 112, 754 106, 794 104" fill="none" stroke="#5e6b7e" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="744" y="96" text-anchor="middle" font-size="11" fill="#5eead4">verified</text>
  <path d="M722 160 L794 160" fill="none" stroke="#5e6b7e" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="756" y="150" text-anchor="middle" font-size="11" fill="#e8c57a">none</text>
  <path d="M336 188 C 336 252, 940 262, 940 254" fill="none" stroke="#5e6b7e" stroke-width="1.4" marker-end="url(#ah2)"/>
  <text x="636" y="248" text-anchor="middle" font-size="11" fill="#f0a8b8">retries exhausted</text>

  <text x="600" y="306" text-anchor="middle" font-size="11.5" fill="#5a6478">partial is an honest answer: work happened, proof did not — without evidence a task is never called completed</text>
</svg>
